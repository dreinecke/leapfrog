<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Leapfrog · Omarchy themes</title>
    <style>
      :root {
        --ink: #f7f7f4;
        --muted: #a5a9b2;
        --page: #090a0c;
        --panel: #111318;
        --line: #292d35;
        --accent: #509475;
        --theme-background: #111c18;
        --theme-surface: #23372b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 74% -20%, color-mix(in srgb, var(--accent) 19%, transparent), transparent 42rem),
          var(--page);
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        backdrop-filter: blur(18px);
      }

      .sidebar__head {
        padding: 28px 24px 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(1.7rem, 3vw, 2.35rem);
        letter-spacing: -0.045em;
      }

      .lede,
      .section-copy,
      .empty {
        color: var(--muted);
        line-height: 1.55;
      }

      .lede {
        margin-bottom: 18px;
        font-size: 0.9rem;
      }

      .search {
        width: 100%;
        min-height: 44px;
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        color: var(--ink);
        background: #090a0d;
      }

      .search:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
      }

      .theme-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 90px;
        gap: 12px;
        height: calc(100vh - 204px);
        padding: 16px;
        overflow-y: auto;
        align-content: start;
      }

      .theme-card {
        position: relative;
        min-width: 0;
        height: 100%;
        overflow: hidden;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        background: #17191f;
        transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
      }

      .theme-card:hover {
        transform: translateY(-2px);
        border-color: #555b67;
      }

      .theme-card:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 75%, white);
        outline-offset: 2px;
      }

      .theme-card[aria-pressed="true"] {
        border-color: var(--card-accent);
        box-shadow: 0 0 0 2px var(--card-accent);
      }

      .theme-card__image,
      .theme-card__fallback {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .theme-card__fallback {
        background:
          linear-gradient(135deg, transparent 43%, color-mix(in srgb, var(--card-accent) 70%, white) 43% 57%, transparent 57%),
          linear-gradient(155deg, var(--card-background), var(--card-surface));
      }

      .theme-card__shade {
        position: absolute;
        inset: 35% 0 0;
        background: linear-gradient(transparent, rgb(0 0 0 / 88%));
      }

      .theme-card__name {
        position: absolute;
        right: 10px;
        bottom: 9px;
        left: 10px;
        overflow: hidden;
        color: white;
        font-size: 0.83rem;
        font-weight: 750;
        line-height: 1.18;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px black;
        white-space: nowrap;
      }

      .current-dot {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 9px;
        height: 9px;
        border: 2px solid white;
        border-radius: 999px;
        background: var(--card-accent);
        box-shadow: 0 1px 5px black;
      }

      main {
        min-width: 0;
        padding: clamp(24px, 4vw, 58px);
      }

      .theme-heading {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 220px;
        margin-bottom: 42px;
        padding: clamp(28px, 5vw, 54px);
        border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--line));
        border-radius: 24px;
        background:
          linear-gradient(115deg, rgb(0 0 0 / 10%), rgb(0 0 0 / 58%)),
          linear-gradient(145deg, var(--theme-surface), var(--theme-background));
        box-shadow: 0 24px 70px rgb(0 0 0 / 25%);
      }

      .theme-heading::after {
        position: absolute;
        z-index: -1;
        top: -100px;
        right: -60px;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
        filter: blur(90px);
        opacity: 0.32;
      }

      .theme-heading h2 {
        max-width: 900px;
        margin: 0 0 13px;
        color: white;
        font-size: clamp(2.6rem, 7vw, 6.5rem);
        font-weight: 780;
        letter-spacing: -0.065em;
        line-height: 0.9;
        text-shadow: 0 2px 12px rgb(0 0 0 / 50%);
      }

      .metadata {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
      }

      .pill {
        padding: 6px 10px;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 999px;
        color: white;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: rgb(0 0 0 / 35%);
        backdrop-filter: blur(8px);
      }

      .section {
        margin-bottom: 48px;
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .section-head h3 {
        margin-bottom: 15px;
        font-size: 1.25rem;
        letter-spacing: -0.025em;
      }

      .section-copy {
        margin-bottom: 15px;
        font-size: 0.84rem;
      }

      .background-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 16px;
      }

      .background-card {
        overflow: hidden;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
      }

      .background-card img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #050506;
      }

      .background-card figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 50px;
        padding: 10px 12px;
        color: #e7e8eb;
        font-size: 0.84rem;
      }

      .background-card small {
        flex: none;
        color: var(--muted);
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .swatch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
        gap: 12px;
      }

      .swatch {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 118px;
        overflow: hidden;
        padding: 14px;
        align-items: end;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 13px;
        background: var(--swatch);
      }

      .swatch::after {
        position: absolute;
        z-index: -1;
        inset: 32% 0 0;
        background: linear-gradient(transparent, rgb(0 0 0 / 88%));
        content: "";
      }

      .swatch__text {
        min-width: 0;
        color: white;
        line-height: 1.2;
        text-shadow: 0 1px 3px black;
      }

      .swatch__name {
        display: block;
        overflow-wrap: anywhere;
        font-size: 0.88rem;
        font-weight: 760;
      }

      .swatch__hex {
        display: block;
        margin-top: 5px;
        color: rgb(255 255 255 / 78%);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      .empty {
        padding: 32px;
        border: 1px dashed #3a3e47;
        border-radius: 14px;
        text-align: center;
        background: var(--panel);
      }

      @media (max-width: 820px) {
        .shell {
          display: block;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .theme-list {
          display: flex;
          height: auto;
          overflow-x: auto;
        }

        .theme-card {
          flex: 0 0 152px;
        }

        main {
          padding: 24px 16px 44px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Theme browser">
        <div class="sidebar__head">
          <p class="eyebrow">Leapfrog</p>
          <h1>Theme library</h1>
          <p class="lede" id="library-summary">Installed Omarchy themes</p>
          <input class="search" id="search" type="search" placeholder="Find a theme…" aria-label="Find a theme" />
        </div>
        <nav class="theme-list" id="theme-list" aria-label="Installed themes"></nav>
      </aside>

      <main id="theme-detail" tabindex="-1"></main>
    </div>

    <script src="themes.js"></script>
    <script>
      (() => {
        "use strict";

        const data = window.OMARCHY_THEME_DATA;
        const themeList = document.querySelector("#theme-list");
        const themeDetail = document.querySelector("#theme-detail");
        const search = document.querySelector("#search");
        const summary = document.querySelector("#library-summary");
        let selectedSlug = location.hash.slice(1) || data.current || data.themes[0]?.slug;

        const escapeHtml = (value) => String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

        const themeBySlug = (slug) => data.themes.find((theme) => theme.slug === slug);

        const fallbackPreview = (theme) => `
          <div class="theme-card__fallback" aria-hidden="true"></div>
        `;

        const themeCard = (theme) => `
          <button
            class="theme-card"
            type="button"
            data-theme="${escapeHtml(theme.slug)}"
            aria-label="Show ${escapeHtml(theme.name)}"
            aria-pressed="${theme.slug === selectedSlug}"
            style="--card-accent:${theme.ui.accent};--card-background:${theme.ui.background};--card-surface:${theme.ui.surface}"
          >
            ${theme.cover
              ? `<img class="theme-card__image" src="${escapeHtml(theme.cover)}" alt="" loading="lazy" />`
              : fallbackPreview(theme)}
            <span class="theme-card__shade" aria-hidden="true"></span>
            <span class="theme-card__name">${escapeHtml(theme.name)}</span>
            ${theme.current ? '<span class="current-dot" title="Current theme" aria-label="Current theme"></span>' : ""}
          </button>
        `;

        const renderThemeList = () => {
          const query = search.value.trim().toLowerCase();
          const visible = data.themes.filter((theme) => theme.name.toLowerCase().includes(query));
          themeList.innerHTML = visible.map(themeCard).join("");
          summary.textContent = `${data.themes.length} installed themes · ${data.themes.reduce((total, theme) => total + theme.backgrounds.length, 0)} backgrounds`;
        };

        const backgroundCard = (background) => `
          <figure class="background-card">
            <img src="${escapeHtml(background.thumbnail)}" alt="${escapeHtml(background.name)} background" loading="lazy" />
            <figcaption>
              <span>${escapeHtml(background.name)}</span>
              <small>${escapeHtml(background.source)}</small>
            </figcaption>
          </figure>
        `;

        const swatch = (color) => `
          <article class="swatch" style="--swatch:${escapeHtml(color.value)}">
            <div class="swatch__text">
              <span class="swatch__name">${escapeHtml(color.key)}</span>
              <span class="swatch__hex">${escapeHtml(color.value)}</span>
            </div>
          </article>
        `;

        const empty = (message) => `<div class="empty">${escapeHtml(message)}</div>`;

        const renderDetail = () => {
          const theme = themeBySlug(selectedSlug) || data.themes[0];
          if (!theme) {
            themeDetail.innerHTML = empty("No Omarchy themes were found.");
            return;
          }
          selectedSlug = theme.slug;
          document.documentElement.style.setProperty("--accent", theme.ui.accent);
          document.documentElement.style.setProperty("--theme-background", theme.ui.background);
          document.documentElement.style.setProperty("--theme-surface", theme.ui.surface);
          document.title = `${theme.name} · Omarchy themes`;

          themeDetail.innerHTML = `
            <header class="theme-heading">
              <p class="eyebrow">${theme.current ? "Current theme" : "Omarchy theme"}</p>
              <h2>${escapeHtml(theme.name)}</h2>
              <p class="metadata">
                <span class="pill">${escapeHtml(theme.mode)} mode</span>
                <span class="pill">${theme.backgrounds.length} background${theme.backgrounds.length === 1 ? "" : "s"}</span>
                <span class="pill">${theme.colors.length} color mapping${theme.colors.length === 1 ? "" : "s"}</span>
              </p>
            </header>

            <section class="section" aria-labelledby="background-title">
              <div class="section-head">
                <h3 id="background-title">Backgrounds</h3>
                <p class="section-copy">Stock, theme-provided, and locally added imagery</p>
              </div>
              <div class="background-grid">
                ${theme.backgrounds.length
                  ? theme.backgrounds.map(backgroundCard).join("")
                  : empty("No backgrounds were found for this theme.")}
              </div>
            </section>

            <section class="section" aria-labelledby="palette-title">
              <div class="section-head">
                <h3 id="palette-title">Color mappings</h3>
                <p class="section-copy">White labels show the exact Omarchy color keys</p>
              </div>
              <div class="swatch-grid">
                ${theme.colors.length
                  ? theme.colors.map(swatch).join("")
                  : empty("No colors.toml mappings were found for this theme.")}
              </div>
            </section>
          `;
          renderThemeList();
        };

        themeList.addEventListener("click", (event) => {
          const button = event.target.closest("[data-theme]");
          if (!button) return;
          selectedSlug = button.dataset.theme;
          history.replaceState(null, "", `#${selectedSlug}`);
          renderDetail();
          if (matchMedia("(max-width: 820px)").matches) {
            themeDetail.focus({ preventScroll: true });
            themeDetail.scrollIntoView({ behavior: "smooth" });
          }
        });

        search.addEventListener("input", renderThemeList);
        window.addEventListener("hashchange", () => {
          selectedSlug = location.hash.slice(1) || data.current;
          renderDetail();
        });

        renderDetail();
      })();
    </script>
  </body>
</html>
